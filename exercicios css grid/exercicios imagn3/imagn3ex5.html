<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imagn3ex5</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: black;
    }

    .grid-container {
      display: grid;

      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);

      gap: 6px;
      width: 100vw;
      height: 100vh;
      padding: 6px;
    }

    .box {
      background-color: pink;
      background-size: cover;
      background-position: center;
    }

    .box-1 {
      grid-column: 1;
      grid-row: 1 / span 2;
    }

    .box-2 {
      grid-column: 2;
      grid-row: 1 / span 2;
    }

    .box-3 {
      grid-column: 3;
      grid-row: 1 / span 2;
    }

    .box-4 {
      grid-column: 4;
      grid-row: 1 / span 2;
    }

    .box-5 {
      grid-column: 5;
      grid-row: 1 / span 2;
    }

    .box-6 {
      grid-column: 6;
      grid-row: 1 / span 2;
    }

    .box-7 {
      grid-column: 1;
      grid-row: 3 / span 2;
    }

    .box-8 {
      grid-column: 2;
      grid-row: 3 / span 2;
    }

    .box-9 {
      grid-column: 3;
      grid-row: 3 / span 2;
    }

    .box-10 {
      grid-column: 4;
      grid-row: 3 / span 2;
    }

    .box-11 {
      grid-column: 5;
      grid-row: 3 / span 2;
    }

    .box-12 {
      grid-column: 6;
      grid-row: 3 / span 2;
    }

    .box-13 {
      grid-column: 1;
      grid-row: 5 / span 2;
    }

    .box-14 {
      grid-column: 2;
      grid-row: 5 / span 2;
    }

    .box-15 {
      grid-column: 3;
      grid-row: 5 / span 2;
    }

    .box-16 {
      grid-column: 4;
      grid-row: 5 / span 2;
    }

    .box-17 {
      grid-column: 5;
      grid-row: 5 / span 2;
    }

    .box-18 {
      grid-column: 6;
      grid-row: 5 / span 2;
    }

  </style>
</head>
<body>

  <div class="grid-container">
    <div class="box box-1"></div>
    <div class="box box-2"></div>
    <div class="box box-3"></div>
    <div class="box box-4"></div>
    <div class="box box-5"></div>
    <div class="box box-6"></div>
    <div class="box box-7"></div>
    <div class="box box-8"></div>
    <div class="box box-9"></div>
    <div class="box box-10"></div>
    <div class="box box-11"></div>
    <div class="box box-12"></div>
    <div class="box box-13"></div>
    <div class="box box-14"></div>
    <div class="box box-15"></div>
    <div class="box box-16"></div>
    <div class="box box-17"></div>
    <div class="box box-18"></div>
  </div>

</body>
</html>
